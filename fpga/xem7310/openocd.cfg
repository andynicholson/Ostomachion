## Ostomachion — OpenOCD configuration for NEORV32 on-chip debugger (XEM7310-A200)
##
## This configuration is for GDB debugging the NEORV32 RISC-V core via the
## on-chip debugger (OCD), NOT for FPGA bitstream programming.
## Use 'make fpga-program' (Vivado) for bitstream loading.
##
## The NEORV32 OCD JTAG signals are routed to MC2 connector pins:
##   MC2-15 (P5)  = TCK
##   MC2-16 (P6)  = TMS
##   MC2-17 (P4)  = TDI
##   MC2-19 (N4)  = TDO
##
## Connect an external JTAG adapter (e.g. FTDI C232HM, Digilent HS2) to
## these MC2 pins.
##
## Usage (NEORV32 OCD / GDB debug — after bitstream is loaded):
##   openocd -f fpga/xem7310/openocd.cfg \
##           -f neorv32/sw/openocd/openocd_neorv32.cfg
##   riscv32-unknown-elf-gdb build_zephyr_fpga/zephyr/zephyr.elf \
##       -ex "target extended-remote localhost:3333"

# ---------------------------------------------------------------------------
# FTDI interface (generic FTDI adapter connected to MC2 NEORV32 OCD pins)
# Adjust ftdi_vid_pid and ftdi_layout_init for your specific JTAG adapter.
# ---------------------------------------------------------------------------
interface ftdi

# FTDI C232HM cable — change these if using a different adapter
ftdi_vid_pid 0x0403 0x6014

ftdi_channel 0
ftdi_layout_init 0x0008 0x000b

ftdi_layout_signal nSRST -oe 0x0020

transport select jtag

# ---------------------------------------------------------------------------
# JTAG chain — XC7A200T (NEORV32 runs inside this FPGA)
# ---------------------------------------------------------------------------
source [find cpld/xilinx-xc7.cfg]

# IDCODE for XC7A200T: 0x13636093
set _CHIPNAME xc7a200t
set _IDCODE   0x13636093

jtag newtap $_CHIPNAME tap \
    -irlen 6 \
    -expected-id $_IDCODE

# ---------------------------------------------------------------------------
# PLD target: intentionally NOT declared here.
#
# This file is for NEORV32 OCD/GDB debug only (see header) — bitstream
# loading goes through Vivado (`make fpga-program`).  The sourced
# cpld/xilinx-xc7.cfg above already registers the series-7 PLD device if you
# ever need it; declaring it again here would just duplicate that.
#
# (For reference: OpenOCDs series-7 PLD driver is named "virtex2" — the xc7
# Artix/Kintex/Virtex parts all use it, so the legacy-sounding name is
# correct, not a Virtex-2 mismatch.  See cpld/xilinx-xc7.cfg.)
