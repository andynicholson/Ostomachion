## Ostomachion — OpenOCD configuration for Arty A7 bitstream programming
##
## Usage (bitstream programming via JTAG):
##   openocd -f fpga/arty_a7/openocd.cfg \
##           -c "pld load 0 build/arty_a7/ostomachion_arty_a7.bit" \
##           -c shutdown
##
## Usage (NEORV32 OCD / GDB debug — after bitstream is loaded):
##   openocd -f fpga/arty_a7/openocd.cfg \
##           -f neorv32/sw/openocd/openocd_neorv32.cfg
##   riscv32-unknown-elf-gdb build/zephyr/zephyr.elf \
##       -ex "target extended-remote localhost:3333"
##
## The Arty A7 uses a Digilent FTDI FT2232HQ for both USB-UART and JTAG.
##   Channel A  — JTAG
##   Channel B  — USB-UART (not used by OpenOCD)

# ---------------------------------------------------------------------------
# FTDI interface (Digilent Arty A7 onboard JTAG)
# ---------------------------------------------------------------------------
interface ftdi

# Digilent vendor/product IDs for the FT2232HQ
ftdi_vid_pid 0x0403 0x6010

# Channel A (index 0) is JTAG; layout follows Digilent convention
ftdi_channel 0
ftdi_layout_init 0x0088 0x008b

# FTDI GPIO assignments: TCK=0, TDI=1, TDO=2, TMS=3
ftdi_layout_signal nSRST -oe 0x0020

transport select jtag

# ---------------------------------------------------------------------------
# JTAG chain and target device
# ---------------------------------------------------------------------------
# Load Xilinx 7-series support.  The xc7a100t has an IR length of 6 bits.
source [find cpld/xilinx-xc7.cfg]

# Declare the Artix-7 XC7A100T in the JTAG chain.
# IDCODE for XC7A100T: 0x13631093
set _CHIPNAME xc7a100t
set _IDCODE   0x13631093

jtag newtap $_CHIPNAME tap \
    -irlen 6 \
    -expected-id $_IDCODE

# ---------------------------------------------------------------------------
# PLD (programmable logic device) target for bitstream loading
# ---------------------------------------------------------------------------
pld device virtex2 $_CHIPNAME.tap 1
