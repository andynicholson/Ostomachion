name: Vivado synthesis + timing closure

# Manual-only FPGA build.  Requires a self-hosted runner with Vivado 2024.1+
# and the label "vivado".  Does not run on PR/push — trigger from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to build
        required: false
        default: master
        type: string

jobs:
  vivado-synth:
    name: Vivado synthesis + timing closure
    runs-on: [self-hosted, vivado]
    if: github.repository_owner == 'andynicholson'
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          ref: ${{ inputs.ref }}
          # Persistent self-hosted runner: force a clean checkout so a previous
          # build of a different ref cannot leave a dirty tree or stale submodule.
          clean: true
          fetch-depth: 0

      - name: Scrub workspace (remove untracked build artifacts)
        # The self-hosted runner is reused across builds; Vivado leaves large
        # untracked outputs (build/, *.jou, *.log, .gen/.runs).  Wipe everything
        # not tracked by git, including in submodules, so each run is reproducible.
        run: |
          git clean -ffdx
          git submodule foreach --recursive "git clean -ffdx" || true

      - name: Run Vivado build
        run: make fpga-synth

      - name: Run quality gate checks
        run: make fpga-check

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: vivado-artifacts
          path: |
            build/xem7310/timing_summary.rpt
            build/xem7310/utilization.rpt
            build/xem7310/drc.rpt
            build/xem7310/build_id.txt
            build/xem7310/ostomachion_xem7310.bit
            build/xem7310/ostomachion_xem7310.mcs
