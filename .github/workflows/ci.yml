name: CI

# Run on every pull request and on direct pushes to main / master / develop.
on:
  pull_request:
  push:
    branches: [main, master, develop]

# Cancel in-progress runs when a new commit arrives on the same branch / PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── GHDL + Zephyr simulation ─────────────────────────────────────────────
  #
  # Builds the Zephyr application (no-FFT sim config), generates the VHDL
  # memory image, and runs the full GHDL co-simulation.
  # Passes when the testbench prints "PROJECT EXECUTION SUCCESSFUL".
  #
  sim:
    name: GHDL + Zephyr simulation
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ghdl ghdl-llvm libllvm18 \
            python3-pip \
            cmake ninja-build \
            gcc-riscv64-unknown-elf

      - name: Work around Ubuntu ghdl-llvm / libllvm18 soname mismatch
        run: |
          if [ ! -e /usr/lib/x86_64-linux-gnu/libLLVM-18.so.18.1 ]; then
            sudo ln -sf libLLVM.so.18.1 /usr/lib/x86_64-linux-gnu/libLLVM-18.so.18.1
          fi

      - name: Install west
        run: pip3 install west

      - name: Set up Zephyr workspace
        run: |
          # west.yml declares self.path=ostomachion; GHA checks out to a sibling
          # directory (…/RepoName/RepoName).  Symlink so west init lands zephyr
          # next to the manifest at the expected layout.
          PARENT="$(dirname "$GITHUB_WORKSPACE")"
          ln -sfn "$GITHUB_WORKSPACE" "$PARENT/ostomachion"
          cd "$PARENT"
          west init -l ostomachion
          west update --narrow -o=--depth=1
          echo "WEST_TOPDIR=$PARENT" >> "$GITHUB_ENV"

      - name: Install Zephyr Python requirements
        run: pip3 install -r "$WEST_TOPDIR/zephyr/scripts/requirements-base.txt"

      - name: Download Zephyr SDK (minimal RISC-V toolchain)
        working-directory: ${{ env.WEST_TOPDIR }}
        run: |
          SDK_VER=1.0.0
          SDK_MIN="zephyr-sdk-${SDK_VER}_linux-x86_64_minimal.tar.xz"
          wget -q "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${SDK_VER}/${SDK_MIN}"
          tar -xf "${SDK_MIN}"
          ./zephyr-sdk-${SDK_VER}/setup.sh -t riscv64-zephyr-elf
          ./zephyr-sdk-${SDK_VER}/setup.sh -h
          ./zephyr-sdk-${SDK_VER}/setup.sh -c
          echo "ZEPHYR_SDK_INSTALL_DIR=$PWD/zephyr-sdk-${SDK_VER}" >> "$GITHUB_ENV"

      - name: Build NEORV32 image_gen (required for zephyr.vhd output)
        run: gcc -O2 neorv32/sw/image_gen/image_gen.c -o neorv32/sw/image_gen/image_gen

      - name: Build Zephyr and run GHDL simulation
        run: |
          set -o pipefail
          make ZEPHYR_SIM_TIME=800ms test-zephyr 2>&1 | tee ghdl_sim.log

      - name: Upload simulation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghdl-sim-log
          path: ghdl_sim.log

  # ── Zephyr Twister (all configs) ─────────────────────────────────────────
  #
  # Runs `west twister` using the testcase.yaml at the zephyr_app root.
  # HW-only cases are excluded via --exclude-tag hw; the neorv32 sim board is
  # used where possible.
  #
  twister:
    name: Twister test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: sim   # only run if the basic sim passes

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-pip cmake ninja-build gcc-riscv64-unknown-elf

      - name: Install west
        run: pip3 install west

      - name: Set up Zephyr workspace
        run: |
          PARENT="$(dirname "$GITHUB_WORKSPACE")"
          ln -sfn "$GITHUB_WORKSPACE" "$PARENT/ostomachion"
          cd "$PARENT"
          west init -l ostomachion
          west update --narrow -o=--depth=1
          echo "WEST_TOPDIR=$PARENT" >> "$GITHUB_ENV"

      - name: Install Zephyr Python requirements
        run: pip3 install -r "$WEST_TOPDIR/zephyr/scripts/requirements-base.txt"

      - name: Download Zephyr SDK (minimal)
        working-directory: ${{ env.WEST_TOPDIR }}
        run: |
          SDK_VER=1.0.0
          SDK_MIN="zephyr-sdk-${SDK_VER}_linux-x86_64_minimal.tar.xz"
          wget -q "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${SDK_VER}/${SDK_MIN}"
          tar -xf "${SDK_MIN}"
          ./zephyr-sdk-${SDK_VER}/setup.sh -t riscv64-zephyr-elf
          ./zephyr-sdk-${SDK_VER}/setup.sh -h
          ./zephyr-sdk-${SDK_VER}/setup.sh -c
          echo "ZEPHYR_SDK_INSTALL_DIR=$PWD/zephyr-sdk-${SDK_VER}" >> "$GITHUB_ENV"

      - name: Run Twister
        run: |
          set -o pipefail
          # -T points at the application root (where testcase.yaml lives next
          # to CMakeLists.txt / prj.conf); --exclude-tag hw drops the cases
          # that require a physical XEM7310 board.  pipefail ensures a Twister
          # failure fails the step rather than being masked by tee's exit code.
          west twister \
            -T zephyr_app \
            --integration \
            --exclude-tag hw \
            --inline-logs \
            -v \
            2>&1 | tee twister.log

      - name: Upload Twister results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twister-results
          path: |
            twister.log
            twister-out/

  # ── VHDL RTL linting ─────────────────────────────────────────────────────
  #
  # Runs GHDL analysis over the simulation-friendly RTL to catch VHDL-2008 syntax
  # and type errors within ~30 s on ubuntu-latest.  The Vivado FPGA top
  # (xem7310_top) uses unisim primitives and is validated via the manual
  # vivado-synth workflow on a self-hosted runner.
  #
  vhdl-lint:
    name: VHDL RTL lint (GHDL)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install GHDL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ghdl ghdl-llvm libllvm18
          if [ ! -e /usr/lib/x86_64-linux-gnu/libLLVM-18.so.18.1 ]; then
            sudo ln -sf libLLVM.so.18.1 /usr/lib/x86_64-linux-gnu/libLLVM-18.so.18.1
          fi

      - name: Analyze NEORV32 core (library neorv32)
        run: |
          ghdl -i --std=08 --work=neorv32 neorv32/rtl/core/*.vhd

      - name: Analyze custom RTL (simulation wrapper)
        run: |
          ghdl -i --std=08 --work=work \
            neorv32/rtl/system_integration/xbus2axi4_bridge.vhd \
            rtl/neorv32_wrapper.vhd

  # ── Firmware static analysis ─────────────────────────────────────────────
  #
  # Runs clang-tidy over the Zephyr application C/C++ sources using the
  # compile_commands.json generated by CMake.  Also extracts a sorted memory
  # map from the ELF and runs CONFIG_THREAD_ANALYZER=y for stack reporting.
  #
  firmware-analysis:
    name: Firmware static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: twister   # only run after the build-only Twister check passes

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-pip cmake ninja-build gcc-riscv64-unknown-elf \
            clang-tidy binutils-riscv64-linux-gnu

      - name: Install west
        run: pip3 install west

      - name: Set up Zephyr workspace
        run: |
          PARENT="$(dirname "$GITHUB_WORKSPACE")"
          ln -sfn "$GITHUB_WORKSPACE" "$PARENT/ostomachion"
          cd "$PARENT"
          west init -l ostomachion
          west update --narrow -o=--depth=1
          echo "WEST_TOPDIR=$PARENT" >> "$GITHUB_ENV"

      - name: Install Zephyr Python requirements
        run: pip3 install -r "$WEST_TOPDIR/zephyr/scripts/requirements-base.txt"

      - name: Download Zephyr SDK (minimal)
        working-directory: ${{ env.WEST_TOPDIR }}
        run: |
          SDK_VER=1.0.0
          SDK_MIN="zephyr-sdk-${SDK_VER}_linux-x86_64_minimal.tar.xz"
          wget -q "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${SDK_VER}/${SDK_MIN}"
          tar -xf "${SDK_MIN}"
          ./zephyr-sdk-${SDK_VER}/setup.sh -t riscv64-zephyr-elf
          ./zephyr-sdk-${SDK_VER}/setup.sh -h
          ./zephyr-sdk-${SDK_VER}/setup.sh -c
          echo "ZEPHYR_SDK_INSTALL_DIR=$PWD/zephyr-sdk-${SDK_VER}" >> "$GITHUB_ENV"

      - name: Build firmware (FPGA sim config + thread analyzer + stack sentinel)
        working-directory: zephyr_app
        run: |
          set -o pipefail
          west build \
            -b neorv32/neorv32/minimalboot \
            -d ../build_analysis \
            -- \
            -DCONF_FILE=prj.conf \
            -DOVERLAY_CONFIG="" \
            -DCONFIG_THREAD_ANALYZER=y \
            -DCONFIG_STACK_SENTINEL=y \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            2>&1 | tee ../analysis_build.log

      - name: Run clang-tidy on application sources
        run: |
          set -o pipefail
          cd build_analysis
          # --warnings-as-errors='*' makes clang-tidy exit non-zero on any
          # finding so this is a real gate; pipefail propagates that exit code
          # through tee.  Triage findings rather than re-muting the gate.
          clang-tidy \
            --config-file=../zephyr_app/.clang-tidy \
            --warnings-as-errors='*' \
            --quiet \
            -p compile_commands.json \
            $(find ../zephyr_app/src ../zephyr_app/drivers -name '*.c' -o -name '*.cpp') \
            2>&1 | tee ../clang_tidy.log

      - name: Generate memory map (nm --size-sort)
        run: |
          set -euo pipefail
          # Pick whichever RISC-V nm is actually installed (the workflow
          # installs binutils-riscv64-linux-gnu).  Fail loudly if neither
          # exists or the ELF is missing, instead of uploading an error log
          # disguised as a memory map.
          NM=""
          for cand in riscv64-unknown-elf-nm riscv64-linux-gnu-nm; do
            if command -v "$cand" >/dev/null 2>&1; then NM="$cand"; break; fi
          done
          if [ -z "$NM" ]; then
            echo "::error::no RISC-V nm found (expected riscv64-linux-gnu-nm)"
            exit 1
          fi
          test -f build_analysis/zephyr/zephyr.elf
          "$NM" --size-sort --print-size build_analysis/zephyr/zephyr.elf > memory_map.txt
          echo "=== Top 20 symbols by size ===" && tail -20 memory_map.txt

      - name: Upload analysis artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-analysis
          path: |
            clang_tidy.log
            memory_map.txt
            analysis_build.log
