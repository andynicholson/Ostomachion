name: CI

# Run on every pull request and on direct pushes to main / develop.
on:
  pull_request:
  push:
    branches: [main, develop]

# Cancel in-progress runs when a new commit arrives on the same branch / PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── GHDL + Zephyr simulation ─────────────────────────────────────────────
  #
  # Builds the Zephyr application (no-FFT sim config), generates the VHDL
  # memory image, and runs the full GHDL co-simulation.
  # Passes when the testbench prints "PROJECT EXECUTION SUCCESSFUL".
  #
  sim:
    name: GHDL + Zephyr simulation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ghdl ghdl-llvm \
            python3-pip \
            cmake ninja-build \
            gcc-riscv64-unknown-elf

      - name: Install west
        run: pip3 install west

      - name: Set up Zephyr workspace
        run: |
          west init -l .
          west update --narrow -o=--depth=1

      - name: Install Zephyr Python requirements
        run: pip3 install -r zephyr/scripts/requirements-base.txt

      - name: Download Zephyr SDK (minimal RISC-V toolchain)
        run: |
          SDK_VER=1.0.0
          SDK_MIN="zephyr-sdk-${SDK_VER}_linux-x86_64_minimal.tar.xz"
          wget -q "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${SDK_VER}/${SDK_MIN}"
          tar -xf "${SDK_MIN}"
          ./zephyr-sdk-${SDK_VER}/setup.sh -h -c
          echo "ZEPHYR_SDK_INSTALL_DIR=$PWD/zephyr-sdk-${SDK_VER}" >> "$GITHUB_ENV"

      - name: Build Zephyr (simulation config)
        working-directory: zephyr_app
        run: |
          west build \
            -b neorv32 \
            -d ../build_zephyr_ci \
            -- \
            -DCONF_FILE=prj.conf \
            -DOVERLAY_CONFIG="" 2>&1 | tee ../build_zephyr_ci.log
          echo "Zephyr build finished."

      - name: Run GHDL simulation
        run: |
          make SIM_TIME=400ms test-zephyr 2>&1 | tee ghdl_sim.log
          # Fail the job if the expected success string is absent.
          grep -q "PROJECT EXECUTION SUCCESSFUL" ghdl_sim.log || \
            { echo "FAIL: simulation did not print PROJECT EXECUTION SUCCESSFUL"; exit 1; }

      - name: Upload simulation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghdl-sim-log
          path: ghdl_sim.log

  # ── Zephyr Twister (all configs) ─────────────────────────────────────────
  #
  # Runs `west twister` using the testcase.yaml in zephyr_app/tests/.
  # Does NOT require hardware; the neorv32 sim board is used where possible.
  #
  twister:
    name: Twister test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: sim   # only run if the basic sim passes

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-pip cmake ninja-build gcc-riscv64-unknown-elf

      - name: Install west
        run: pip3 install west

      - name: Set up Zephyr workspace
        run: |
          west init -l .
          west update --narrow -o=--depth=1

      - name: Install Zephyr Python requirements
        run: pip3 install -r zephyr/scripts/requirements-base.txt

      - name: Download Zephyr SDK (minimal)
        run: |
          SDK_VER=1.0.0
          SDK_MIN="zephyr-sdk-${SDK_VER}_linux-x86_64_minimal.tar.xz"
          wget -q "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${SDK_VER}/${SDK_MIN}"
          tar -xf "${SDK_MIN}"
          ./zephyr-sdk-${SDK_VER}/setup.sh -h -c
          echo "ZEPHYR_SDK_INSTALL_DIR=$PWD/zephyr-sdk-${SDK_VER}" >> "$GITHUB_ENV"

      - name: Run Twister
        run: |
          west twister \
            -T zephyr_app/tests \
            --integration \
            --inline-logs \
            -v \
            2>&1 | tee twister.log

      - name: Upload Twister results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twister-results
          path: |
            twister.log
            twister-out/

  # ── Vivado FPGA synthesis (self-hosted runner, optional) ─────────────────
  #
  # Requires a self-hosted runner with Vivado 2024.1+ and the label "vivado".
  # Skipped on forks (no access to licensed tools) and when the runner is
  # unavailable; does not block merging.
  #
  vivado-synth:
    name: Vivado synthesis + timing closure
    runs-on: [self-hosted, vivado]
    if: |
      github.repository_owner == 'ostomachion' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 120
    needs: sim

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run Vivado build
        run: make fpga-synth

      - name: Run quality gate checks
        run: make fpga-check

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vivado-artifacts
          path: |
            build/arty_a7/timing_summary.rpt
            build/arty_a7/utilization.rpt
            build/arty_a7/drc.rpt
            build/arty_a7/build_id.txt
            build/arty_a7/ostomachion_arty_a7.bit
            build/arty_a7/ostomachion_arty_a7.mcs

  # ── VHDL RTL linting ─────────────────────────────────────────────────────
  #
  # Runs GHDL --synth over the custom RTL files to catch VHDL-2008 syntax and
  # type errors within ~30 s on ubuntu-latest.  No Xilinx tools are required.
  # NEORV32 core sources are analyzed first (as library neorv32) because the
  # top-level instantiates the NEORV32 SoC.  Fails the PR on any error.
  #
  vhdl-lint:
    name: VHDL RTL lint (GHDL)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install GHDL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ghdl ghdl-llvm

      - name: Analyze NEORV32 core (library neorv32)
        run: |
          ghdl -i --std=08 --work=neorv32 neorv32/rtl/core/*.vhd

      - name: Analyze custom RTL and FPGA top
        run: |
          ghdl -i --std=08 --work=work \
            neorv32/rtl/system_integration/xbus2axi4_bridge.vhd \
            rtl/neorv32_wrapper.vhd
          ghdl -i --std=08 --work=work \
            fpga/arty_a7/arty_a7_top.vhd

      - name: Elaborate FPGA top (checks for missing entities / type errors)
        run: |
          ghdl -m --std=08 --work=work arty_a7_top

  # ── Firmware static analysis ─────────────────────────────────────────────
  #
  # Runs clang-tidy over the Zephyr application C/C++ sources using the
  # compile_commands.json generated by CMake.  Also extracts a sorted memory
  # map from the ELF and runs CONFIG_THREAD_ANALYZER=y for stack reporting.
  #
  firmware-analysis:
    name: Firmware static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: twister   # only run after the build-only Twister check passes

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-pip cmake ninja-build gcc-riscv64-unknown-elf \
            clang-tidy binutils-riscv64-linux-gnu

      - name: Install west
        run: pip3 install west

      - name: Set up Zephyr workspace
        run: |
          west init -l .
          west update --narrow -o=--depth=1

      - name: Install Zephyr Python requirements
        run: pip3 install -r zephyr/scripts/requirements-base.txt

      - name: Download Zephyr SDK (minimal)
        run: |
          SDK_VER=1.0.0
          SDK_MIN="zephyr-sdk-${SDK_VER}_linux-x86_64_minimal.tar.xz"
          wget -q "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${SDK_VER}/${SDK_MIN}"
          tar -xf "${SDK_MIN}"
          ./zephyr-sdk-${SDK_VER}/setup.sh -h -c
          echo "ZEPHYR_SDK_INSTALL_DIR=$PWD/zephyr-sdk-${SDK_VER}" >> "$GITHUB_ENV"

      - name: Build firmware (FPGA sim config + thread analyzer + stack sentinel)
        working-directory: zephyr_app
        run: |
          west build \
            -b neorv32 \
            -d ../build_analysis \
            -- \
            -DCONF_FILE=prj.conf \
            -DOVERLAY_CONFIG="" \
            -DCONFIG_THREAD_ANALYZER=y \
            -DCONFIG_STACK_SENTINEL=y \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            2>&1 | tee ../analysis_build.log

      - name: Run clang-tidy on application sources
        run: |
          cd build_analysis
          clang-tidy \
            --config-file=../zephyr_app/.clang-tidy \
            --quiet \
            -p compile_commands.json \
            $(find ../zephyr_app/src ../zephyr_app/drivers -name '*.c' -o -name '*.cpp') \
            2>&1 | tee ../clang_tidy.log || true
          echo "clang-tidy done (non-zero exit is non-blocking)"

      - name: Generate memory map (nm --size-sort)
        run: |
          riscv64-unknown-elf-nm --size-sort --print-size \
            build_analysis/zephyr/zephyr.elf \
            > memory_map.txt 2>&1 || \
          riscv64-linux-gnu-nm --size-sort --print-size \
            build_analysis/zephyr/zephyr.elf \
            > memory_map.txt 2>&1 || true
          echo "=== Top 20 symbols by size ===" && head -20 memory_map.txt || true

      - name: Upload analysis artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-analysis
          path: |
            clang_tidy.log
            memory_map.txt
            analysis_build.log
