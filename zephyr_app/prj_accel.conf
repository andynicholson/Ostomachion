#
# Stacked on: prj.conf + prj_fpga.conf + prj_hw_test.conf
# Build mode: Automated / CI ZTEST accelerator build.
#
# This fragment only adds the FFT accelerator driver.  CONFIG_ZTEST is NOT set
# in prj.conf (the clean production base); it is supplied by the invoking layer
# — testcase.yaml extra_configs (CONFIG_ZTEST=y) for Twister/HW, or the
# `make test-accel-hw` target.  Verbose ZTEST output comes from prj_hw_test.conf.

CONFIG_FFT_ACCEL=y
CONFIG_FFT_ACCEL_LOG_LEVEL_INF=y
