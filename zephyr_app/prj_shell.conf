# prj_shell.conf — Kconfig fragment for the interactive shell build
# Copyright (c) 2026  SPDX-License-Identifier: GPL-3.0-or-later OR LicenseRef-Ostomachion-Commercial-1.0
#
# Stacked on: prj.conf + prj_fpga.conf
# Build mode: Interactive / Development
#
# CONFIG_ZTEST is explicitly NOT set — the shell owns the UART terminal.
# The LED blink thread and shell thread run indefinitely after boot.

# --- Disable ZTEST (overrides any default) ---
# CONFIG_ZTEST is not set

# --- Zephyr shell ---
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_CMD_BUFF_SIZE=128
CONFIG_SHELL_STACK_SIZE=2048
CONFIG_SHELL_LOG_BACKEND=y

# --- FFT accelerator driver ---
CONFIG_FFT_ACCEL=y

# --- Logging over shell ---
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y

# --- C++ support for fft_accel.hpp ---
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_FPU=y

# --- Larger stacks for shell + FFT workloads ---
CONFIG_MAIN_STACK_SIZE=4096
