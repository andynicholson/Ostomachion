# Ostomachion — FPGA (XEM7310-A200) Kconfig fragment
#
# Applied on top of prj.conf when building the FPGA firmware target.
# Increases stack sizes to suit a real RTOS workload and enables the
# interrupt-driven SPI/I2C driver paths (polling is retained in prj.conf
# for simulation convenience).

# Larger stacks for FPGA with real workloads
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Interrupt-driven drivers — production hardware path
# (DTS nodes in app.overlay already declare the correct IRQ numbers;
# this just selects the IRQ code path inside the driver.)
CONFIG_SPI_NEORV32_INTERRUPT=y
CONFIG_I2C_NEORV32_INTERRUPT=y

# Watchdog — hardware WDT enabled (IO_WDT_EN=true in xem7310_top.vhd).
# The application feeds it every 500 ms in the LED blink thread.
# Default timeout: 5000 ms (5 s).  Increase if workloads block longer.
CONFIG_WATCHDOG=y
CONFIG_WDT_NEORV32=y
