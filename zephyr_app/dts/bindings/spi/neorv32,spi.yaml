description: NEORV32 SPI controller

compatible: "neorv32,spi"

include: [spi-controller.yaml, base.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  syscon:
    type: phandle
    required: true
    description: phandle to NEORV32 SYSINFO syscon node.
