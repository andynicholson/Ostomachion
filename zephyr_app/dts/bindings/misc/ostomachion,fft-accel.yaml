#
# DTS binding for the Ostomachion FFT accelerator pipeline.
# The FFT core is the Xilinx xfft IP; it has no AXI4-Lite slave interface.
# All data movement is handled by the AXI DMA.
#
# Example DTS node:
#
#   fft_accel: fft-accel@40000000 {
#       compatible = "ostomachion,fft-accel";
#       reg = <0x40000000 0x40>,     /* AXI DMA control registers  (64 B)  */
#             <0x41000000 0x4000>,   /* TX BRAM                   (16 KB)  */
#             <0x41004000 0x4000>;   /* RX BRAM                   (16 KB)  */
#       reg-names = "dma", "tx_bram", "rx_bram";
#       bram-size = <16384>;
#       interrupts = <11>;          /* RISC-V MEI line (IRQ 11) */
#       status = "okay";
#   };

description: Ostomachion AXI DMA + Xilinx xfft hardware accelerator pipeline

compatible: "ostomachion,fft-accel"

include: base.yaml

properties:
  reg:
    required: true

  reg-names:
    required: true
    description: |
      Must be "dma", "tx_bram", "rx_bram" in that order.

  bram-size:
    type: int
    required: true
    description: Size of each BRAM buffer in bytes (TX and RX are equal).

  interrupts:
    required: true
    description: |
      Machine External Interrupt (MEI), IRQ 11 on the riscv,cpu-intc (&intc).

      Interrupt topology (v1.0 — single-accelerator platform):
        irq_concat/In0 = AXI DMA mm2s_introut  (MM2S completion / error)
        irq_concat/In1 = AXI DMA s2mm_introut  (S2MM completion / error)
        irq_concat/In2 = xfft m_axis_status_tvalid  (FFT overflow)
      All three are OR-reduced into one MEI wire.  The driver ISR
      distinguishes sources by reading DMASR registers.

      Single-wire MEI limit: this design supports ONE accelerator.
      Adding a second accelerator (e.g. matrix-multiply, AES) requires
      replacing irq_concat with a Xilinx AXI INTC IP (PLIC-like) and
      feeding its single output to MEI while mapping each accelerator's
      interrupt to a distinct INTC channel.  See "interrupt-architecture"
      in docs/production_readiness_review.md for the migration plan.
