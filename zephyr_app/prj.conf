# Core Kernel Features
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_SPI_NEORV32=y
CONFIG_I2C=y
CONFIG_I2C_NEORV32=y

# Modern C++ Support
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_PICOLIBC=y

# NOTE: CONFIG_ZTEST is intentionally NOT set here.  prj.conf is the clean
# base/production config; the ZTEST framework is opt-in per build:
#   - GHDL sim test       : added by the `zephyr` Makefile target
#   - Twister / HW tests  : added via testcase.yaml extra_configs
# This keeps the CI firmware-analysis build (CONF_FILE=prj.conf) a real
# production image rather than a test build pulling in all tests/*.cpp.

# I2C slave address for the GHDL testbench slave model (0x50 = 80).
# Set to 0 to skip slave tests.
CONFIG_TEST_I2C_SLAVE_ADDR=80
