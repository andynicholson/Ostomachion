# Hardware test configuration overlay.
#
# Applied on top of prj.conf + prj_fpga.conf for hardware test builds:
#   make test-hw
#
# Enables verbose ztest output and per-subsystem logging so results can be
# read from the UART console at 115200 baud.
#
# CONFIG_TEST_I2C_SLAVE_ADDR=0 means the slave-dependent I2C tests are skipped
# gracefully.  Set to the 7-bit address of any attached I2C device to enable
# those tests (e.g. CONFIG_TEST_I2C_SLAVE_ADDR=80 for a device at 0x50).

# Zephyr logging subsystem
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Per-driver log levels (INFO = level 3)
CONFIG_SPI_LOG_LEVEL_INF=y
CONFIG_I2C_LOG_LEVEL_INF=y
CONFIG_GPIO_LOG_LEVEL_INF=y

# Verbose ztest output — prints each test name and PASS/FAIL clearly
CONFIG_ZTEST_VERBOSE_OUTPUT=y

# Run the full I2C bus scan (111 probes, ~50 ms) — hardware only.
# Disabled by default to keep GHDL simulation within its 400 ms window.
CONFIG_TEST_I2C_BUS_SCAN=y

# Run the full 64-iteration SPI stress test — hardware only.
# Default (16) fits within the GHDL 400 ms window at ~1 ms/transfer.
CONFIG_TEST_SPI_STRESS_COUNT=64

# No I2C slave attached by default; override on the command line or in a
# per-board fragment if a slave device is present.
CONFIG_TEST_I2C_SLAVE_ADDR=0
