# prj_demo.conf — Kconfig fragment for the host-driven FFT demo firmware
# Copyright (c) 2026  SPDX-License-Identifier: Apache-2.0
#
# Stacked on: prj.conf + prj_fpga.conf + prj_accel.conf
# Build mode: standalone demo loop (no ZTEST, no Zephyr shell)
#
# Used by: `make demo-hw`.  Drives the FFT accelerator from sample frames
# pushed across the FrontPanel BTPipe endpoints 0x81 / 0xA1 (the host-side
# entry point lives in tools/fft_demo/).

# --- Disable ZTEST (the default base prj.conf enables it) ---
# CONFIG_ZTEST is not set

# --- Enable the application-level FFT demo thread ---
CONFIG_FFT_DEMO=y

# --- Larger stack for the demo thread + FFT transform ---
CONFIG_MAIN_STACK_SIZE=4096

# --- FPU on, matching prj_shell.conf (cosf in test helpers, future use) ---
CONFIG_FPU=y

# --- Logging surface (deferred so the LED-blink thread keeps the WDT fed) ---
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
